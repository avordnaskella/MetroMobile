openapi: 3.0.3
info:
  title: МетроОсмотр API
  version: 1.0.0
  description: 'Серверное API мобильного приложения «МетроОсмотр» (осмотр путей и тоннелей метро).


    **Версионирование.** Мажорная версия в пути: `/api/v1`. Ломающие изменения — только в новой мажорной версии (`/api/v2`); добавление необязательных полей и новых эндпоинтов версию не меняет. Старая версия работает не менее 6 месяцев после выхода новой; о выводе из эксплуатации сообщают заголовки `Deprecation` и `Sunset`.


    **Авторизация.** JWT (access, 15 мин) + refresh-токен (30 дней, одноразовый, с ротацией). Роль проверяется на каждом запросе.


    **Пагинация.** Курсорная: `limit` + `cursor`. Ответ содержит `nextCursor` (null на последней странице).


    **Идемпотентность.** Код неисправности (`id`) и код записи истории генерирует клиент (UUID) при создании записи на устройстве. Повторная отправка с тем же кодом не создаёт дубликат.

    '
  contact:
    name: Команда МетроОсмотр
servers:
- url: https://api.metro-inspect.example.com/api/v1
  description: Продуктивный сервер
- url: http://localhost:8080/api/v1
  description: Локальная разработка
tags:
- name: Auth
  description: Вход и токены
- name: Defects
  description: Неисправности
- name: Reference
  description: Справочники
- name: Shifts
  description: Осмотры смен (бригады)
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Вход по логину и паролю
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: ivanov
              password: S3cret!pass
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refreshToken: 9f2c6e0a-7d1b-4c58-a3e4-1b2f5c7d8e90
                tokenType: Bearer
                expiresIn: 900
                user:
                  id: 3f1c2a9e-5b7d-4e21-9a10-7c6d5e4f3a21
                  login: ivanov
                  lastName: Иванов
                  firstName: Иван
                  middleName: Иванович
                  role: WORKER
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Обновление пары токенов
      description: 'Refresh-токен одноразовый: после обновления выдаётся новая пара, а запись сессии со старым токеном удаляется. Повторное использование старого токена даёт 401.'
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Выход (отзыв refresh-токена)
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '204':
          description: Сессия завершена
        '401':
          $ref: '#/components/responses/Unauthorized'
  /defects:
    get:
      tags:
      - Defects
      summary: Список неисправностей (фильтры, курсорная пагинация)
      operationId: listDefects
      parameters:
      - name: sectionId
        in: query
        schema:
          type: string
          format: uuid
      - name: trackId
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        description: Можно несколько значений через запятую
        schema:
          type: array
          items:
            $ref: '#/components/schemas/DefectStatus'
        style: form
        explode: false
      - name: categoryId
        in: query
        schema:
          type: integer
      - name: typeId
        in: query
        schema:
          type: integer
      - name: severity
        in: query
        schema:
          $ref: '#/components/schemas/Severity'
      - name: picketFrom
        in: query
        description: Нижняя граница пикета, метры от начала участка
        schema:
          type: integer
          minimum: 0
      - name: picketTo
        in: query
        schema:
          type: integer
          minimum: 0
      - name: q
        in: query
        description: Поиск по тексту комментария
        schema:
          type: string
          maxLength: 100
      - name: detectedFrom
        in: query
        description: Дата/время обнаружения от
        schema:
          type: string
          format: date-time
      - name: detectedTo
        in: query
        description: Дата/время обнаружения до
        schema:
          type: string
          format: date-time
      - name: shiftId
        in: query
        description: Неисправности конкретного осмотра смены
        schema:
          type: string
          format: uuid
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - detectedAt
          - -detectedAt
          - picket
          - -picket
          default: -detectedAt
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница неисправностей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefectPage'
              example:
                items:
                - id: 7b1d2e3f-4a5b-4c6d-8e9f-0a1b2c3d4e5f
                  userId: 3f1c2a9e-5b7d-4e21-9a10-7c6d5e4f3a21
                  shiftId: c0a80101-0000-4000-8000-0000000000b1
                  sectionId: a1b2c3d4-0000-4000-8000-000000000001
                  trackId: a1b2c3d4-0000-4000-8000-0000000000a1
                  categoryId: 2
                  typeId: 14
                  picket: 1250
                  severity: CRITICAL
                  status: NEW
                  comment: Отсутствует болт крепления подкладки
                  detectedAt: '2026-10-25T01:14:00Z'
                  photoUrl: null
                nextCursor: eyJkIjoiMjAyNi0xMC0yNVQwMToxNDowMFoiLCJpIjoiN2IxZC4uLiJ9
                hasMore: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Defects
      summary: Создать неисправность (идемпотентно по id)
      description: 'Код неисправности `id` генерирует клиент. Повторная отправка с тем же `id` от того же пользователя не создаёт дубликат: сервер возвращает уже созданную запись с кодом **200** (первое создание — **201**). Фото отправляется отдельным запросом `POST /defects/{defectId}/photo`.'
      operationId: createDefect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefectCreate'
            example:
              id: 7b1d2e3f-4a5b-4c6d-8e9f-0a1b2c3d4e5f
              shiftId: c0a80101-0000-4000-8000-0000000000b1
              sectionId: a1b2c3d4-0000-4000-8000-000000000001
              trackId: a1b2c3d4-0000-4000-8000-0000000000a1
              categoryId: 2
              typeId: 14
              picket: 1250
              severity: CRITICAL
              comment: Отсутствует болт крепления подкладки
              detectedAt: '2026-10-25T01:14:00Z'
      responses:
        '201':
          description: Запись создана
          headers:
            Location:
              schema:
                type: string
              description: URL созданной записи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Defect'
        '200':
          description: Запись с таким id уже существует (повторная отправка)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Defect'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Код неисправности уже занят записью другого пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: DEFECT_ID_CONFLICT
                  message: Неисправность с таким кодом уже существует
                  requestId: req_01JB8Z
        '422':
          $ref: '#/components/responses/PicketOutOfRange'
  /defects/{defectId}:
    parameters:
    - $ref: '#/components/parameters/DefectId'
    get:
      tags:
      - Defects
      summary: Карточка неисправности
      operationId: getDefect
      responses:
        '200':
          description: Неисправность с фото и историей статусов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefectDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Defects
      summary: Изменить поля неисправности
      description: Изменение полей записи. Последнее изменение побеждает; все смены статуса сохраняются в истории.
      operationId: updateDefect
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefectUpdate'
      responses:
        '200':
          description: Обновлённая запись
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Defect'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/PicketOutOfRange'
  /defects/{defectId}/status:
    post:
      tags:
      - Defects
      summary: Сменить статус (NEW → IN_PROGRESS → FIXED → VERIFIED)
      description: 'Допустимые переходы: `NEW→IN_PROGRESS`, `IN_PROGRESS→FIXED`, `FIXED→VERIFIED`,

        а также возврат `FIXED→IN_PROGRESS` при отклонении проверки.

        Статус `VERIFIED` может ставить только `FOREMAN` или `DISPATCHER`.

        '
      operationId: changeDefectStatus
      parameters:
      - $ref: '#/components/parameters/DefectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChangeRequest'
            example:
              id: 5c9e6679-7425-40de-944b-e07fc1f90ae7
              toStatus: FIXED
              comment: Болт установлен, момент затяжки проверен
      responses:
        '200':
          description: Статус изменён, возвращена запись с историей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefectDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Недопустимый переход статуса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_STATUS_TRANSITION
                  message: Нельзя перейти из NEW сразу в VERIFIED
                  requestId: req_01JB91
  /sections:
    get:
      tags:
      - Reference
      summary: Участки и их пути
      operationId: listSections
      responses:
        '200':
          description: Список участков
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Section'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /defect-types:
    get:
      tags:
      - Reference
      summary: Типы неисправностей
      operationId: listDefectTypes
      responses:
        '200':
          description: Справочник
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DefectType'
              example:
                items:
                - id: 14
                  name: Отсутствует болт крепления
                - id: 15
                  name: Трещина рельса
        '401':
          $ref: '#/components/responses/Unauthorized'
  /shifts:
    post:
      tags:
      - Shifts
      summary: Открыть осмотр смены (бригадир)
      operationId: openShift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - sectionId
              - memberIds
              properties:
                id:
                  type: string
                  format: uuid
                  description: Код осмотра смены, генерирует клиент
                sectionId:
                  type: string
                  format: uuid
                memberIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                inspectedAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Смена открыта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Осмотр с таким id уже создан (повторная отправка)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
  /defects/{defectId}/photo:
    parameters:
    - $ref: '#/components/parameters/DefectId'
    post:
      tags:
      - Defects
      summary: Загрузить фото неисправности (multipart)
      description: JPEG/PNG до 5 МБ. Клиент сжимает фото перед отправкой. Повторная загрузка заменяет предыдущее фото, поэтому запрос безопасно повторять.
      operationId: uploadPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Файл больше 5 МБ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: PAYLOAD_TOO_LARGE
                  message: Размер файла превышает 5 МБ
                  requestId: req_01JB92
        '415':
          description: Неподдерживаемый тип файла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Фото сохранено, возвращена обновлённая запись
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Defect'
  /defect-categories:
    get:
      tags:
      - Reference
      summary: Категории объекта
      operationId: listDefectCategories
      responses:
        '200':
          description: Список категорий
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DefectCategory'
              example:
                items:
                - id: 1
                  name: Рельсовое полотно
                - id: 2
                  name: Крепления (болты, клеммы, подкладки)
                - id: 3
                  name: Земляное полотно
        '401':
          $ref: '#/components/responses/Unauthorized'
  /shifts/{shiftId}:
    get:
      tags:
      - Shifts
      summary: Осмотр смены со сводкой по неисправностям
      operationId: getShift
      parameters:
      - name: shiftId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Осмотр и сводка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Заголовок `Authorization: Bearer <accessToken>`. Токен живёт 15 минут.'
  parameters:
    DefectId:
      name: defectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Непрозрачный курсор из поля `nextCursor` предыдущей страницы
      schema:
        type: string
  responses:
    ValidationError:
      description: Ошибка валидации входных данных
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Некорректные данные
              requestId: req_01JB93
              details:
              - field: picket
                message: Должно быть целым числом от 0
    PicketOutOfRange:
      description: Пикет вне границ выбранного участка
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: PICKET_OUT_OF_RANGE
              message: Пикет вне границ участка
              requestId: req_01JB94
              details:
              - field: picket
                message: Допустимый диапазон 0–2400 м
    InvalidCredentials:
      description: Неверный логин или пароль
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_CREDENTIALS
              message: Неверный логин или пароль
              requestId: req_01JB95
    Unauthorized:
      description: Токен отсутствует, недействителен или истёк
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer error="invalid_token"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: TOKEN_EXPIRED
              message: Сессия истекла, войдите снова
              requestId: req_01JB96
    Forbidden:
      description: Недостаточно прав для роли пользователя
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: Недостаточно прав для этого действия
              requestId: req_01JB97
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Неисправность не найдена
              requestId: req_01JB98
    TooManyRequests:
      description: Превышен лимит запросов
      headers:
        Retry-After:
          schema:
            type: integer
          description: Через сколько секунд повторить
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Машинный код ошибки (см. таблицу кодов)
            message:
              type: string
              description: Текст для пользователя
            requestId:
              type: string
              description: Идентификатор запроса для логов
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    LoginRequest:
      type: object
      required:
      - login
      - password
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
    TokenPair:
      type: object
      required:
      - accessToken
      - refreshToken
      - tokenType
      - expiresIn
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          description: Время жизни access-токена в секундах
        user:
          $ref: '#/components/schemas/User'
    Role:
      type: string
      enum:
      - WORKER
      - FOREMAN
      - DISPATCHER
    Severity:
      type: string
      enum:
      - LOW
      - MEDIUM
      - CRITICAL
    DefectStatus:
      type: string
      enum:
      - NEW
      - IN_PROGRESS
      - FIXED
      - VERIFIED
    Section:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Перегон А — Б
        start:
          type: integer
          description: Начало участка, м
        end:
          type: integer
          description: Конец участка, м
        tracks:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
                example: Главный путь 1
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        lastName:
          type: string
        firstName:
          type: string
        middleName:
          type: string
          nullable: true
